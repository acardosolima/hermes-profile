_config_version: 49
agent:
  disabled_toolsets:
    - a2a
    - bot_room
    - browser
    - computer_use
    - connections
    - context_engine
    - cronjob
    - desktop_ui
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - homeassistant
    - image_gen
    - kanban
    - memory
    - project
    - search
    - session_search
    - spotify
    - stt
    - tts
    - video
    - video_gen
    - web
    - x_search
    - yuanbao
  fast_auto_seconds: 60
  max_turns: 90
  personalities: {}
  reasoning_effort: medium
  service_tier: ""
  verbose: false
auth:
  adopt_external_logins: true
  codex_login_flow: device_code
browser:
  extension_control:
    enabled: false
  inactivity_timeout: 120
code_execution:
  max_tool_calls: 50
  timeout: 300
compression:
  checkpoint_required: false
  codex_app_server_auto: native
  codex_gpt55_autoraise: true
  codex_responses_native: false
  enabled: false
  hygiene_max_turn_hold_seconds: 10
  idle_compact_after_seconds: 0
  max_attempts: 3
  min_tail_user_messages: 1
  proactive_prune_min_reclaim_tokens: 4096
  proactive_prune_min_result_chars: 8000
  proactive_prune_tokens: 0
  progress_notices: false
  protect_first_n: 3
  protect_last_n: 20
  target_ratio: 0.2
  threshold: 0.5
cron:
  catch_up_missed: true
database:
  journal_mode: wal
delegation:
  max_iterations: 250
  provider: anthropic
  model: claude-sonnet-5
display:
  background_process_notifications: concise
  bell_on_complete: false
  bell_on_prompt: false
  busy_ack_detail: true
  busy_input_mode: interrupt
  cleanup_progress: false
  compact: false
  interim_assistant_messages: true
  long_running_notifications: true
  show_reasoning: true
  skin: default
  streaming: true
  suppress_warning_notifications: false
  tool_progress: all
gateway:
  allow_all_users: false
  api_server:
    history_tool_output_max_chars: 0
    max_concurrent_runs: 10
  auto_multiplex_migration: true
  bot_loop_guard:
    cooldown_seconds: 600
    enabled: true
    max_events: 20
    window_seconds: 300
  delivery_ledger: true
  loop_watchdog: true
  loop_watchdog_max_strikes: 3
  loop_watchdog_probe_interval_s: 30
  loop_watchdog_probe_timeout_s: 10
  max_inbound_media_bytes: 134217728
  media_delivery_allow_dirs: []
  message_timestamps:
    enabled: false
  multiplex_profiles: true
  platform_connect_timeout: 30
  profile_routes: []
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  restart_loop_guard:
    max_gap_seconds: 300
    max_restarts: 3
    window_seconds: 60
  scale_to_zero:
    idle_timeout_minutes: 2
  signal_interrupt_grace_timeout: 1
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  strict: false
  trust_env: true
  trust_recent_files: true
  trust_recent_files_seconds: 600
  write_sessions_json: true
group_sessions_per_user: true
kanban:
  review_dispatch: true
known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
