    - homeassistant
    - spotify
  acp:
    - homeassistant
  webhook:
    - homeassistant
memory:
  memory_char_limit: 2200
  memory_enabled: false
  nudge_interval: 10
  user_char_limit: 1375
  user_profile_enabled: false
model:
  default: claude-sonnet-5
  provider: anthropic
platform_toolsets:
  cli:
    - clarify
    - code_execution
    - delegation
    - file
    - skills
    - terminal
    - todo
    - vision
  discord:
    - hermes-discord
  google_chat:
    - hermes-google_chat
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  signal:
    - hermes-signal
  slack:
    - hermes-slack
  teams:
    - hermes-teams
  telegram:
    - hermes-telegram
  whatsapp:
    - hermes-whatsapp
  yuanbao:
    - hermes-yuanbao
platforms:
  slack:
    enabled: true
    home_channel:
      chat_id: C0C3VB0U23X
      name: C0C3VB0U23X
      platform: slack
      scope_id: T11941FML
      user_id: U09CCTDRFNF
prompt_caching:
  cache_ttl: 5m
providers:
  ollama-launch:
    api: http://127.0.0.1:11434/v1
    default_model: hermes3:8b
    models:
      - hermes3:8b
      - llama3.2:latest
    name: Ollama
runtime:
  nofile_soft_limit: 4096
skills:
  creation_nudge_interval: 15
  auto_load:
    - test-driven-development
    - requesting-code-review
    - systematic-debugging
smart_model_routing:
  enabled: false
streaming:
  enabled: false
stt:
  enabled: true
  language: en
  local:
    model: base
  openai:
    language: ""
    max_retries: 1
    model: whisper-1
    timeout: 60
telemetry:
  shared_metrics:
    enabled: false
    send: false
terminal:
  backend: local
  container_cpu: 1
  container_disk: 51200
  container_memory: 5120
  container_persistent: true
  cwd: .
  docker_mount_cwd_to_workspace: false
  home_mode: auto
  lifetime_seconds: 300
  timeout: 180
tool_loop_guardrails:
  hard_stop_after:
    exact_failure: 5
    idempotent_no_progress: 5
    same_tool_failure: 8
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    idempotent_no_progress: 2
    same_tool_failure: 3
  warnings_enabled: true
toolsets:
  - hermes-cli
  - web
updates:
  backup_keep: 5
  check: true
  non_interactive_local_changes: stash
  pre_update_backup: false
_left_core_scoped:
  - homeassistant
plugins:
  enabled:
    - homeassistant
  disabled: []
_left_core_installed:
  - homeassistant
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
