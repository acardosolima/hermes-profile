[tool.poetry]
name = "hermes-profile"
version = "1.3.0"
description = "Personal agent config"
authors = ["Adriano Lima"]
license = "MIT"
readme = "README.md"

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
version_variables = ["distribution.yaml:version:nf"]
branch = "master"
upload_to_release = true
build_command = "echo no build"
major_on_zero = false
allow_zero_version = true
changelog_file = "CHANGELOG.md"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Annotations use `from __future__ import annotations`; Optional[...] stays readable on 3.9.
ignore = ["UP045", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tools/tests/*" = ["E501", "UP031"]
"tests/guard/*" = ["E501", "UP031", "E402"]
